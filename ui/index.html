<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zeitop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell" aria-label="Zeitop">
<header class="topbar">
  <section class="branding">
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <span class="brand">Zei<span>Top</span></span>
    <span class="subbrand">FRAME PACING</span>
  </section>
  <nav class="tools" aria-label="Controls">
    <button id="toggle" class="tool power" type="button" aria-label="Enable limiter" title="Toggle limiter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 2.7v9.1"/><path d="M7.1 5.6a8 8 0 1 0 9.8 0"/></svg>
    </button>
    <button id="fg-toggle" class="tool fg-toggle" type="button" aria-label="Enable lsfg-vk" aria-pressed="false" title="Frame Generation (next game launch)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.5" y="7" width="12" height="12" rx="2"/>
        <path d="M8 4.5h10.5a2 2 0 0 1 2 2V17"/>
        <path d="M8.5 13.5l2 2 3.5-5"/>
      </svg>
    </button>
    <button id="copy" class="tool" type="button" aria-label="Copy Steam launch command" title="Copy Steam launch command">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></svg>
    </button>
    <button id="settings" class="tool" type="button" aria-label="Settings" title="Frame Generation Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.1 13.9a7.8 7.8 0 0 0 .05-3.8l2-1.55-2-3.4-2.4.9a7 7 0 0 0-3.2-1.84L13.1 1.6h-3.9l-.45 2.6a7.6 7.6 0 0 0-3.2 1.85l-2.4-.9-1.95 3.4L3.3 10a8.5 8.5 0 0 0 0 4l-2.1 1.5 1.95 3.4 2.4-.9a7 7 0 0 0 3.2 1.85l.45 2.55h3.9l.45-2.55a7 7 0 0 0 3.2-1.85l2.4.9 2-3.4z" transform="translate(1 -1) scale(.91)"/></svg>
    </button>
    <span class="separator"></span>
    <button id="close" class="tool close" type="button" aria-label="Close Zeitop" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </nav>
</header>
<section class="readouts" aria-label="Frame-time metrics">
  <div class="measurement">
    <span class="metric-label">FT CURRENT</span>
    <div class="metric-line"><strong id="real">--<small>.--</small></strong><span class="unit">ms</span></div>
  </div>
  <div class="metric-divider"></div>
  <div class="measurement">
    <span class="metric-label">FT AVERAGE</span>
    <div class="metric-line"><strong id="average">--<small>.--</small></strong><span class="unit">ms</span></div>
  </div>
  <div class="target">
    <span class="target-label">TARGET</span>
    <b>33.33<span> ms</span></b>
  </div>
</section>
<section class="chart-card" aria-label="Frame-time graph">
  <div class="chart-heading"><span><span class="live-dot" id="live-dot"></span><span id="connected">WAITING FOR GAME</span></span><span class="chart-note">LAST 100 SAMPLES</span></div>
  <canvas id="graph" width="440" height="84" aria-label="Frame-time history graph"></canvas>
  <div class="axis"><span>FRAME TIME</span><span id="graph-target">33.33 MS · TARGET</span></div>
</section>
<div class="toast" id="toast" role="status"></div>
</main>
<script src="main.js"></script>
</body>
</html>
